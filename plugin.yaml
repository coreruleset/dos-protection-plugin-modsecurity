# OWASP CRS Plugin Descriptor
# See plugin-schema.json in coreruleset/plugin-registry for the full JSON Schema definition.
# Docs: https://github.com/coreruleset/plugin-registry

schema_version: 1

plugin:
  name: "dos-protection-modsecurity-plugin"
  description: "Anti-automation rules to detect and block denial of service (DoS) attacks"
  long_description: |
    Blocks clients that make requests to non-static resources too quickly. A
    per-IP counter is raised for each request to a non-static resource
    (extensions listed in tx.static_extensions are excluded). Once the counter
    reaches tx.dos_counter_threshold, a burst is recorded, the counter
    resets, and the burst is forgotten after tx.dos_burst_time_slice
    seconds. After two bursts (one in
    paranoia level 2), the client IP is blocked for tx.dos_block_timeout
    seconds; blocked requests are dropped without a response.

    This plugin protects against small-scale, application-level DoS attacks.
    It is not suited to network-level DoS, distributed DoS (DDoS), or other
    large-scale attacks, since ModSecurity's own performance degrades under
    that kind of load. For those cases, use mod_reqtimeout, mod_evasive,
    mod_qos, a load balancer/traffic washer, or a dedicated DoS
    protection/CDN service instead.
  type: "official"
  category: "protection"
  status: "untested"
  license: "Apache-2.0"
  authors:
    - name: "OWASP CRS Team"
      url: "https://coreruleset.org"
  repository: "https://github.com/coreruleset/dos-protection-plugin-modsecurity"
  keywords:
    - "dos"
    - "denial-of-service"
    - "anti-automation"
    - "rate-limiting"
    - "protection"

rule_id_range:
  start: 9514000
  end: 9514999

compatibility:
  crs_version: ">=4.0.0"
  engines:
    - "modsecurity2"

configuration:
  file: "plugins/dos-protection-config.conf"
  variables:
    - name: "tx.dos-protection-plugin_enabled"
      type: "boolean"
      default: 1
      description: "Enable or disable the plugin (0 to disable)"
      required: false

    - name: "tx.dos_counter_threshold"
      type: "integer"
      default: 100
      description: >-
        Number of requests to non-static resources from a single IP that is
        considered a burst.
      required: false

    - name: "tx.dos_burst_time_slice"
      type: "integer"
      default: 60
      description: >-
        Time period in seconds after which a recorded burst is forgotten
        (the burst counter expires).
      required: false

    - name: "tx.dos_block_timeout"
      type: "integer"
      default: 600
      description: "Number of seconds an IP address is blocked for after a DoS attack is identified"
      required: false

    - name: "tx.static_extensions"
      type: "list"
      default: "/.avif/ /.css/ /.gif/ /.ico/ /.jpeg/ /.jpg/ /.map/ /.mjs/ /.js/ /.png/ /.svg/ /.webp/ /.woff/ /.woff2/"
      description: "File extensions considered static resources and excluded from DoS request counting"
      separator: " "
      prefix: "/"
      suffix: "/"
      example: "/.avif/ /.css/"
      required: false
